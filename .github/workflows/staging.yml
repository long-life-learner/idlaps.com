name: Staging checks and release package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - run: php artisan test --compact
      - run: node --test resources/js/lib/results.test.js

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build cPanel package without local secrets or data
        run: bash .github/deploy/build-release.sh "$RUNNER_TEMP/idlaps-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idlaps-staging-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idlaps-release/idlaps-staging.zip
            ${{ runner.temp }}/idlaps-release/idlaps-staging.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload package over explicit FTPS
        if: vars.STAGING_FTP_ENABLED == 'true'
        env:
          FTP_HOST: bintang.indowebsite.net
          FTP_PORT: '21'
          FTP_USERNAME: staging@idlaps.com
          FTP_DIRECTORY: /
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/deploy/upload-package.py "$RUNNER_TEMP/idlaps-release/idlaps-staging.zip"
      - name: Report pending hosting setup
        if: vars.STAGING_FTP_ENABLED != 'true'
        run: echo '::notice::Release artifact is ready. FTPS upload remains disabled until its directory, credentials and server activation are configured.'
